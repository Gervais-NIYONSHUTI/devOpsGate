name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}

      - name: Install dependencies
        run: mvn clean install -DskipTests

      - name: Install Playwright browsers
        run: |
          PLAYWRIGHT_JAR=$(find ~/.m2/repository/com/microsoft/playwright -name "playwright-*.jar" | grep -v sources | grep -v javadoc | head -1)
          java -cp $PLAYWRIGHT_JAR com.microsoft.playwright.CLI install chromium --with-deps

      - name: Run tests
        run: mvn test
